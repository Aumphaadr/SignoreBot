name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Соединение оверлея — гонки подключения и реконнект
        run: npm run test:overlay
      - name: Типы и сборка панели
        run: npm run build
      - name: Стражи — внешние адреса, значки, шрифты, лицензии библиотек
        run: npm run check
      - name: Сайт в docs/ совпадает с пересборкой
        run: |
          npm run site
          git diff --exit-code -- docs/
